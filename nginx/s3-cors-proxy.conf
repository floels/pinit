server {
    listen 80;

    # Disable nginx's request body size limit (default: 1 MB) so that image
    # uploads of any size can be proxied through to moto.
    client_max_body_size 0;

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, DELETE, HEAD, OPTIONS';
            add_header 'Access-Control-Allow-Headers' '*';
            return 200;
        }
        proxy_pass http://moto:5000;
    }
}
