name: Deploy Staging

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'infra/k8s/overlays/staging/kustomization.yaml'
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: write
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOYMENT_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOYMENT_AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build
        run: |
          IMAGE_URI=${{ steps.ecr-login.outputs.registry }}/pinit-api:${{ github.sha }}
          docker build -f backend/Dockerfile.staging -t $IMAGE_URI ./backend
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Update image tag in K8s overlay
        run: |
          cd infra/k8s/overlays/staging
          kustomize edit set image pinit-api=${{ steps.ecr-login.outputs.registry }}/pinit-api:${{ github.sha }}

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/overlays/staging/kustomization.yaml
          git commit -m "ci: deploy backend ${{ github.sha }} to staging"
          git push

  deploy-frontend:
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install dependencies
        run: pnpm install
        working-directory: web

      - name: Build web app
        run: pnpm build
        working-directory: web
        env:
          BACKEND_URL: ${{ secrets.STAGING_BACKEND_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOYMENT_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOYMENT_AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Sync web app to S3
        run: aws s3 sync web/dist s3://pinit-staging-frontend --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.STAGING_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
