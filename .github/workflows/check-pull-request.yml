name: Check Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      web-e2e: ${{ steps.filter.outputs.web-e2e }}
      mobile-e2e: ${{ steps.filter.outputs.mobile-e2e }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/check-pull-request.yml'
            web:
              - 'web/**'
              - '.github/workflows/check-pull-request.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/check-pull-request.yml'
            # Shared E2E stack + web suite — drives the web-e2e Playwright job.
            web-e2e:
              - 'web/**'
              - 'e2e-tests-web/**'
              - 'backend/**'
              - 'docker-compose.e2e.yml'
              - 'scripts/e2e-backend-up.sh'
              - 'nginx/**'
              - '.github/workflows/check-pull-request.yml'
            # Mobile app + shared E2E stack — drives the mobile-e2e Detox job.
            # True when any of: mobile/** (incl. e2e-tests), backend/**,
            # docker-compose.e2e.yml, scripts/e2e-backend-up.sh, nginx/**,
            # or this workflow file. Overlaps web-e2e on purpose; each suite
            # has its own job when the shared stack changes.
            mobile-e2e:
              - 'mobile/**'
              - 'backend/**'
              - 'docker-compose.e2e.yml'
              - 'scripts/e2e-backend-up.sh'
              - 'nginx/**'
              - '.github/workflows/check-pull-request.yml'

  web-e2e:
    needs: detect-changes
    if: needs.detect-changes.outputs.web-e2e == 'true'
    runs-on: ubuntu-latest
    # Cold Elasticsearch/Postgres pulls + backend image build dominate wall time.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Install web dependencies
        run: pnpm --dir web install

      - name: Install e2e-tests-web dependencies
        run: pnpm --dir e2e-tests-web install

      - name: Install Playwright Chromium
        run: pnpm --dir e2e-tests-web exec playwright install --with-deps chromium

      - name: Run Playwright web E2E
        run: pnpm --dir e2e-tests-web test

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-playwright-report
          path: |
            e2e-tests-web/playwright-report/
            e2e-tests-web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down E2E Docker stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  # Detox iOS needs a simulator, so this job runs on macOS. Standard arm64
  # runners (macos-latest) cannot run Docker (no nested virt); macos-15-intel
  # is still a free standard public runner and can host Colima for the shared
  # E2E stack. Do not switch to billed larger macOS runners.
  mobile-e2e:
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile-e2e == 'true'
    runs-on: macos-15-intel
    # Expo prebuild + CocoaPods + Release xcodebuild + Detox dominate wall time.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Inline Colima setup (not douglascamata/setup-docker-macos-action): that
      # action passes --memory=$host_ram (14GiB on this runner), which OOMs /
      # hangs the nested VM. Keep steps separate so a hang is visible in CI.
      - name: Install Lima and Colima
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LIMA_VERSION=$(gh release -R lima-vm/lima view --json tagName -q ".tagName")
          COLIMA_VERSION=$(gh release -R abiosoft/colima view --json tagName -q ".tagName")
          echo "Installing Lima ${LIMA_VERSION} and Colima ${COLIMA_VERSION}"
          # Lima v2 ships helpers under /usr/local/libexec.
          if [[ "${LIMA_VERSION}" == v2.* ]]; then
            sudo mkdir -p /usr/local/libexec
            sudo chown "${UID}:$(id -g)" /usr/local/libexec
          fi
          curl -fsSL "https://github.com/lima-vm/lima/releases/download/${LIMA_VERSION}/lima-${LIMA_VERSION#v}-$(uname -s)-$(uname -m).tar.gz" \
            | sudo tar -C /usr/local -xz
          curl -fsSL -o /tmp/colima "https://github.com/abiosoft/colima/releases/download/${COLIMA_VERSION}/colima-$(uname)-$(uname -m)"
          sudo install /tmp/colima /usr/local/bin/colima

      - name: Install Docker CLI
        working-directory: ${{ github.workspace }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          set -euo pipefail
          brew install docker docker-compose docker-buildx
          mkdir -p ~/.docker/cli-plugins
          ln -sfn "$(brew --prefix docker-compose)/bin/docker-compose" ~/.docker/cli-plugins/docker-compose
          ln -sfn "$(brew --prefix docker-buildx)/bin/docker-buildx" ~/.docker/cli-plugins/docker-buildx

      - name: Start Colima
        working-directory: ${{ github.workspace }}
        # Leave headroom on the 14GiB host; Elasticsearch + backend need ~2–3GiB.
        run: |
          set -euo pipefail
          colima start --cpu 4 --memory 8 --disk 20 --arch x86_64 --vm-type=vz --mount-type=virtiofs
          # Elasticsearch refuses to start (or stays unhealthy) without this.
          colima ssh -- sudo sysctl -w vm.max_map_count=262144
          docker info

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Install mobile dependencies
        run: yarn install --frozen-lockfile

      - name: Install applesimutils
        working-directory: ${{ github.workspace }}
        run: |
          brew tap wix/brew
          brew trust wix/brew
          brew install applesimutils
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1

      - name: Start E2E Docker backend
        working-directory: ${{ github.workspace }}
        run: ./scripts/e2e-backend-up.sh

      - name: Dump E2E stack logs on failure
        if: failure()
        working-directory: ${{ github.workspace }}
        run: docker compose -f docker-compose.e2e.yml logs --tail 100 || true

      - name: Build Detox iOS app (ios.sim.release)
        run: yarn test:e2e:build

      - name: Run Detox iOS E2E
        # No suite-level CI retries — first pass must succeed.
        run: yarn test:e2e --cleanup

      - name: Tear down E2E Docker stack
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose -f docker-compose.e2e.yml down -v

  backend-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment:
      name: test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build Docker container
        run: docker compose -f docker-compose.test.yml up -d

      - name: Run migrations
        run: docker compose -f docker-compose.test.yml exec -T web python manage.py migrate

      - name: Run unit tests
        run: docker compose -f docker-compose.test.yml exec -T web python manage.py test

      - name: Shut down Docker container
        run: docker compose -f docker-compose.test.yml down

  web-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Type-check
        run: pnpm type-check

      - name: Run unit tests
        run: pnpm test

  mobile-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Type-check
        run: yarn type-check

      - name: Run unit tests
        run: yarn jest --runInBand
