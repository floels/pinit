name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      web-e2e: ${{ steps.filter.outputs.web-e2e }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/check-pull-request.yml'
            web:
              - 'web/**'
              - '.github/workflows/check-pull-request.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/check-pull-request.yml'
            # Shared E2E stack + web suite. Consumed by a future web-e2e job (FLO-23).
            web-e2e:
              - 'web/**'
              - 'e2e-tests-web/**'
              - 'backend/**'
              - 'docker-compose.e2e.yml'
              - 'scripts/e2e-backend-up.sh'
              - 'nginx/**'
              - '.github/workflows/check-pull-request.yml'

  # Placeholder so the new filter is exercised in CI until FLO-23 wires Playwright.
  web-e2e:
    needs: detect-changes
    if: needs.detect-changes.outputs.web-e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm web-e2e path filter
        run: echo "web-e2e paths changed; Playwright job lands in FLO-23"

  backend-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment:
      name: test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build Docker container
        run: docker compose -f docker-compose.test.yml up -d

      - name: Run migrations
        run: docker compose -f docker-compose.test.yml exec -T web python manage.py migrate

      - name: Run unit tests
        run: docker compose -f docker-compose.test.yml exec -T web python manage.py test

      - name: Shut down Docker container
        run: docker compose -f docker-compose.test.yml down

  web-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Type-check
        run: pnpm type-check

      - name: Run unit tests
        run: pnpm test

  mobile-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Type-check
        run: yarn type-check

      - name: Run unit tests
        run: yarn jest --runInBand
