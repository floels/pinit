name: Check Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      web-e2e: ${{ steps.filter.outputs.web-e2e }}
      # Consumed by a future macOS Detox job (not wired yet).
      mobile-e2e: ${{ steps.filter.outputs.mobile-e2e }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/check-pull-request.yml'
            web:
              - 'web/**'
              - '.github/workflows/check-pull-request.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/check-pull-request.yml'
            # Shared E2E stack + web suite — drives the web-e2e Playwright job.
            web-e2e:
              - 'web/**'
              - 'e2e-tests-web/**'
              - 'backend/**'
              - 'docker-compose.e2e.yml'
              - 'scripts/e2e-backend-up.sh'
              - 'nginx/**'
              - '.github/workflows/check-pull-request.yml'
            # Mobile app + shared E2E stack — for a future macos Detox job.
            # True when any of: mobile/** (incl. e2e-tests), backend/**,
            # docker-compose.e2e.yml, scripts/e2e-backend-up.sh, nginx/**,
            # or this workflow file. Overlaps web-e2e on purpose; each suite
            # has its own job when the shared stack changes.
            mobile-e2e:
              - 'mobile/**'
              - 'backend/**'
              - 'docker-compose.e2e.yml'
              - 'scripts/e2e-backend-up.sh'
              - 'nginx/**'
              - '.github/workflows/check-pull-request.yml'

  web-e2e:
    needs: detect-changes
    if: needs.detect-changes.outputs.web-e2e == 'true'
    runs-on: ubuntu-latest
    # Cold Elasticsearch/Postgres pulls + backend image build dominate wall time.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Install web dependencies
        run: pnpm --dir web install

      - name: Install e2e-tests-web dependencies
        run: pnpm --dir e2e-tests-web install

      - name: Install Playwright Chromium
        run: pnpm --dir e2e-tests-web exec playwright install --with-deps chromium

      - name: Run Playwright web E2E
        run: pnpm --dir e2e-tests-web test

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-playwright-report
          path: |
            e2e-tests-web/playwright-report/
            e2e-tests-web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down E2E Docker stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  backend-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment:
      name: test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build Docker container
        run: docker compose -f docker-compose.test.yml up -d

      - name: Run migrations
        run: docker compose -f docker-compose.test.yml exec -T web python manage.py migrate

      - name: Run unit tests
        run: docker compose -f docker-compose.test.yml exec -T web python manage.py test

      - name: Shut down Docker container
        run: docker compose -f docker-compose.test.yml down

  web-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Type-check
        run: pnpm type-check

      - name: Run unit tests
        run: pnpm test

  mobile-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Type-check
        run: yarn type-check

      - name: Run unit tests
        run: yarn jest --runInBand
