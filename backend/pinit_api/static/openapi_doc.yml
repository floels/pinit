openapi: 3.0.3
info:
  title: PinIt API
  version: 1.0.0
paths:
  /api/accounts/{username}/:
    get:
      operationId: accounts/<username>/
      description: Get the public details for account with username 'username'.
      parameters:
        - in: path
          name: username
          schema:
            type: string
          required: true
      tags:
        - Accounts
      security:
        - null
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountWithPublicDetails'
        '404':
          description: No account found for this username
  /api/accounts/{username}/pins/:
    get:
      operationId: accounts/<username>/pins/
      description: Get the list of pins created by account with username 'username', ordered by most recently created.
      parameters:
        - in: path
          name: username
          schema:
            type: string
          required: true
        - name: page
          in: query
          description: Page number. Default is 1.
          schema:
            type: integer
      tags:
        - Accounts
      security:
        - null
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinWithFullDetailsPaginatedList'
        '404':
          description: No account found for this username
  /api/accounts/me/:
    get:
      operationId: accounts/me/
      description: Get the public details for the account owned by the authenticated
        user.
      tags:
        - Accounts
      security:
        - jwtAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountWithPrivateDetails'
        '401':
          description: Failed authentication
  /api/boards/:
    post:
      operationId: boards/
      description: Create a new board.
      tags:
        - Boards
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Board name
                pin_id:
                  type: string
                  description: ID of a pin to save in the board upon creation
              required:
                - name
      security:
        - jwtAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardBase'
        '400':
          description: Missing board name
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - board_name_required
        '401':
          description: Failed authentication
        '404':
          description: Pin not found for provided pin_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - pin_not_found
  /api/boards/{username}/{slug}/:
    get:
      operationId: boards/<username>/<slug>/
      description: Get the details for the board identified by 'username' and 'slug'.
      parameters:
        - in: path
          name: username
          schema:
            type: string
          required: true
        - in: path
          name: slug
          schema:
            type: string
          required: true
      tags:
        - Boards
      security:
        - null
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardWithFullDetails'
        '404':
          description: No account or board found for the provided username and slug
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - account_not_found
                            - board_not_found
                          description: |-
                            Error code. One of:
                            * `account_not_found`: No account found for this username
                            * `board_not_found`: No board found for this slug
  /api/pins/:
    post:
      operationId: pins/
      description: Create a new pin. The image must be uploaded to S3 first via the
        `GET /api/pins/upload-url/` endpoint; pass the returned `image_file_key` here.
      tags:
        - Pins
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                image_file_key:
                  type: string
                  description: S3 key of the already-uploaded image, as returned by GET /api/pins/upload-url/
                  example: pins/pin_image_3f2a1b4c5d6e7f8a9b0c1d2e3f4a5b6c.jpg
                title:
                  type: string
                  description: Pin title
                description:
                  type: string
                  description: Pin description
              required:
                - image_file_key
      security:
        - jwtAuth: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pin'
        '400':
          description: Missing or invalid image file key
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - missing_pin_image_file
                            - invalid_pin_image_file_key
                          description: |-
                            Error code. One of:
                            * `missing_pin_image_file`: `image_file_key` field is missing
                            * `invalid_pin_image_file_key`: `image_file_key` does not match the expected pattern
        '401':
          description: Failed authentication
  /api/pins/suggestions/:
    get:
      operationId: pins/suggestions/
      description: Get the list of pin suggestions for the authenticated user.
      parameters:
        - name: page
          in: query
          description: Page number. Default is 1.
          schema:
            type: integer
      tags:
        - Pins
      security:
        - jwtAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinWithAuthorDetailsPaginatedList'
        '401':
          description: Failed authentication
  /api/pins/upload-url/:
    get:
      operationId: pins/upload-url/
      description: Generate a pre-signed S3 URL for uploading a pin image directly
        from the browser. Use the returned `upload_url` to PUT the image, then pass
        the returned `image_file_key` to POST /api/pins/ to create the pin.
      parameters:
        - name: file_extension
          in: query
          required: true
          schema:
            type: string
            enum:
              - .jpg
              - .png
          description: File extension of the image to upload
      tags:
        - Pins
      security:
        - jwtAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_url:
                    type: string
                    format: uri
                    description: Pre-signed S3 URL to PUT the image to
                  image_file_key:
                    type: string
                    description: S3 key to pass to POST /api/pins/ after upload
                    example: pins/pin_image_3f2a1b4c5d6e7f8a9b0c1d2e3f4a5b6c.jpg
        '400':
          description: Invalid or missing file extension
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - invalid_pin_image_file_extension
        '401':
          description: Failed authentication
  /api/pins/{unique_id}/:
    get:
      operationId: pins/<unique_id>/get/
      description: Get detailed information for pin with ID 'unique_id'.
      parameters:
        - in: path
          name: unique_id
          schema:
            type: string
          description: ID of Pin
          required: true
      tags:
        - Pins
      security:
        - null
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinWithFullDetails'
          description: Success
        '404':
          description: No pin found for provided ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - pin_not_found
    patch:
      operationId: pins/<unique_id>/patch/
      description: Update the title and/or description of a pin. Only the pin's author can update it.
      parameters:
        - in: path
          name: unique_id
          schema:
            type: string
          description: ID of Pin
          required: true
      tags:
        - Pins
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: New pin title
                description:
                  type: string
                  description: New pin description
      security:
        - jwtAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinWithFullDetails'
        '401':
          description: Failed authentication
        '403':
          description: Authenticated user is not the pin's author
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - forbidden
        '404':
          description: No pin found for provided ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - pin_not_found
    delete:
      operationId: pins/<unique_id>/delete/
      description: Delete a pin. Only the pin's author can delete it.
      parameters:
        - in: path
          name: unique_id
          schema:
            type: string
          description: ID of Pin
          required: true
      tags:
        - Pins
      security:
        - jwtAuth: []
      responses:
        '204':
          description: Success
        '401':
          description: Failed authentication
        '403':
          description: Authenticated user is not the pin's author
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - forbidden
        '404':
          description: No pin found for provided ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - pin_not_found
  /api/pins/{unique_id}/saves/:
    post:
      operationId: pins/{unique_id}/saves/
      description: Save a pin in a board.
      parameters:
        - name: unique_id
          in: path
          required: true
          schema:
            type: string
          description: ID of Pin to save
          example: "369169980854002"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                board_id:
                  type: string
                  description: ID of board in which to save Pin
                  example: "441312392807868"
              required:
                - board_id
      tags:
        - Pins
      security:
        - jwtAuth: []
      responses:
        '200':
          description: Pin had already been saved in this board. Same response body as 201 response (see below).
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  pin_id:
                    type: string
                    description: ID of saved pin
                    example: "369169980854002"
                  board_id:
                    type: string
                    description: ID of board in which pin was saved
                    example: "441312392807868"
        '401':
          description: Failed authentication
        '403':
          description: Authenticated user doesn't own board
        '404':
          description: No pin or board found for provided ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - pin_not_found
                            - board_not_found
                          description: |-
                            Error code. One of:
                            * `pin_not_found`: Pin was not found for this ID
                            * `board_not_found`: board was not found for this ID
  /api/search/:
    get:
      operationId: search/
      description: Get pins corresponding to search term provided in query param.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search term
          required: true
        - name: page
          in: query
          description: Page number. Default is 1.
          schema:
            type: integer
      tags:
      - Search
      security:
      - null
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinWithAuthorDetailsPaginatedList'
          description: Success
        '400':
          description: No search term provided
        '503':
          description: Elasticsearch unavailable
  /api/search/suggestions/:
    get:
      operationId: search/suggestions/
      description: Get the list of search term suggestions, given an incomplete search term.
      parameters:
      - in: query
        name: search
        schema:
          type: string
        description: Incomplete search term
        required: true
      tags:
      - Search
      security:
      - null
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: string
                      description: Search suggestion
                    description: List of search suggestions
                    example: ["man", "mana", "manage", "manager"]
        '400':
          description: No search term provided
  /api/accounts/mobile/:
    post:
      operationId: accounts/mobile/
      description: |-
        Create a new account (mobile). Returns access and refresh tokens in the response body.
      tags:
      - Sign-up and authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Email
                password:
                  type: string
                  description: Password
                birthdate:
                  type: string
                  format: date
                  description: Birth date
              required:
                - birthdate
                - email
                - password
      security:
      - null
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          description: Failed signup
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          enum:
                            - invalid_email
                            - invalid_password
                            - invalid_birthdate
                            - email_already_signed_up
                          type: string
                          description: |-
                            Error code. One of:
                            * `invalid_email`: invalid email
                            * `invalid_password`: invalid password
                            * `invalid_birthdate`: invalid birth date
                            * `email_already_signed_up`: email is already signed up
  /api/accounts/web/:
    post:
      operationId: accounts/web/
      description: |-
        Create a new account (web). Returns the access token in the response body.
        The refresh token is set as an HttpOnly `refreshToken` cookie.
      tags:
      - Sign-up and authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Email
                password:
                  type: string
                  description: Password
                birthdate:
                  type: string
                  format: date
                  description: Birth date
              required:
                - birthdate
                - email
                - password
      security:
      - null
      responses:
        '201':
          description: Success
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=eyJhbGciO...; Path=/; HttpOnly; SameSite=Strict
              description: HttpOnly cookie containing the refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: Failed signup
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          enum:
                            - invalid_email
                            - invalid_password
                            - invalid_birthdate
                            - email_already_signed_up
                          type: string
                          description: |-
                            Error code. One of:
                            * `invalid_email`: invalid email
                            * `invalid_password`: invalid password
                            * `invalid_birthdate`: invalid birth date
                            * `email_already_signed_up`: email is already signed up
  /api/token/mobile/:
    post:
      operationId: token/mobile/
      description: |-
        Obtain a pair of access and refresh JWT authentication tokens (mobile).
      tags:
      - Sign-up and authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  required: true
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          description: Failed authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          enum:
                            - invalid_email
                            - invalid_password
                          type: string
                          description: |-
                            Error code. One of:
                            * `invalid_email`: invalid email
                            * `invalid_password`: invalid password
  /api/token/web/:
    post:
      operationId: token/web/
      description: |-
        Obtain authentication tokens (web). Returns the access token in the response body.
        The refresh token is set as an HttpOnly `refreshToken` cookie.
      tags:
      - Sign-up and authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
                - email
                - password
      security:
      - null
      responses:
        '200':
          description: Success
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=eyJhbGciO...; Path=/; HttpOnly; SameSite=Strict
              description: HttpOnly cookie containing the refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: Failed authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          enum:
                            - invalid_email
                            - invalid_password
                          type: string
                          description: |-
                            Error code. One of:
                            * `invalid_email`: invalid email
                            * `invalid_password`: invalid password
    delete:
      operationId: token/web/logout
      description: |-
        Log out the current user (web) by clearing the `refreshToken` HttpOnly cookie.
      tags:
        - Sign-up and authentication
      security:
        - null
      responses:
        '200':
          description: Success
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT
              description: Clears the `refreshToken` cookie
  /api/token/mobile/refresh/:
    post:
      operationId: token/mobile/refresh/
      description: |-
        Obtain a new access token using a refresh token (mobile). The refresh token is passed in the request body.
      tags:
        - Sign-up and authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Refresh token
              required:
              - refresh_token
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: Missing refresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - missing_refresh_token
        '401':
          description: Failed refresh
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          enum:
                            - invalid_refresh_token
                          type: string
                          description: |-
                            Error code: `invalid_refresh_token`
  /api/token/web/refresh/:
    post:
      operationId: token/web/refresh/
      description: |-
        Obtain a new access token (web). The refresh token is read from the `refreshToken` HttpOnly cookie.
      tags:
        - Sign-up and authentication
      parameters:
        - in: cookie
          name: refreshToken
          schema:
            type: string
          required: true
          description: Refresh token cookie set during sign-up or token obtain
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: Missing refresh token cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - missing_refresh_token
        '401':
          description: Failed refresh
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          enum:
                            - invalid_refresh_token
                          type: string
                          description: |-
                            Error code: `invalid_refresh_token`
components:
  schemas:
    Account:
      type: object
      properties:
        username:
          type: string
          description: Account username
          example: "johndoe"
        display_name:
          type: string
          description: Account display name
          example: "John Doe"
        initial:
          type: string
          description: Account initial
          example: "J"
        profile_picture_url:
          type: string
          format: uri
          description: Account profile picture URL
    BoardBase:
      type: object
      properties:
        unique_id:
          type: string
          description: Board unique ID
          example: "441312392807868"
        name:
          description: Board name
          type: string
          example: "My food board"
        slug:
          description: Board slug
          type: string
          example: "my-food-board"
    Board:
      allOf:
        - $ref: '#/components/schemas/BoardBase'
        - type: object
          properties:
            first_image_urls:
              description: List of first image URLs
              type: array
              items:
                type: string
                format: uri
    BoardWithFullDetails:
      allOf:
        - $ref: '#/components/schemas/BoardBase'
        - type: object
          properties:
            author:
              description: Board author
              $ref: '#/components/schemas/Account'
            pins:
              type: array
              items:
                $ref: '#/components/schemas/PinWithAuthorDetails'
              description: List of pins saved in the board, ordered by most recently saved
    AccountWithBoards:
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          properties:
            boards:
              type: array
              items:
                $ref: '#/components/schemas/Board'
              description: List of boards authored by the account
    AccountWithPublicDetails:
      allOf:
        - $ref: '#/components/schemas/AccountWithBoards'
        - type: object
          properties:
            initial:
              type: string
              max_length: 1
              description: Account initial
              example: "J"
            background_picture_url:
              type: string
              format: uri
              description: Account background picture URL
            description:
              type: string
              description: Description of the account
    AccountWithPrivateDetails:
      allOf:
        - $ref: '#/components/schemas/AccountWithPublicDetails'
        - properties:
            type:
              type: string
              enum:
                - personal
                - business
              description: Account type
              example: "personal"
            owner_email:
              type: string
              format: email
              description: Account owner email
              example: "johndoe@example.com"
    Pin:
      type: object
      properties:
        unique_id:
          type: string
          description: Pin unique ID
          example: "837672678962535495"
        image_url:
          type: string
          format: uri
          description: Pin image URL
        title:
          type: string
          description: Pin title
          example: "Pin title"
    PinWithAuthorDetails:
