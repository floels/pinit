version: '3'

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  moto:
    image: motoserver/moto:latest
    ports:
      - "5555:5000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate && python manage.py setup_moto_e2e && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - moto
    environment:
      DJANGO_SETTINGS_MODULE: pinit.settings.local
      S3_PINS_BUCKET_UPLOADER_ACCESS_KEY_ID: testing
      S3_PINS_BUCKET_UPLOADER_SECRET_ACCESS_KEY: testing

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://localhost:8000/api

volumes:
  postgres_data:
  frontend_node_modules:
