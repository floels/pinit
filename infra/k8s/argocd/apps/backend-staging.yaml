apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-staging
  namespace: argocd
spec:
  project: default
  source:
    # Replace with the actual repo URL once it's set up in ArgoCD.
    # Register repo credentials first: `argocd repo add <url> --ssh-private-key-path ~/.ssh/id_rsa`
    repoURL: https://github.com/floels/pinit.git
    targetRevision: HEAD
    path: infra/k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: pinit-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
